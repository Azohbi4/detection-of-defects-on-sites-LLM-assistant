  - "menuiserie bois pourriture fenêtre"
  - "installation électrique tableau disjoncteur"
  - "carrelage décollé salle de bain"
  - "fuite plomberie canalisation cuivre"
  - "peinture façade écaillée ravalement"
  - "enrobé chaussée nid-de-poule orniérage"
  - "charpente métallique boulons desserrés"
