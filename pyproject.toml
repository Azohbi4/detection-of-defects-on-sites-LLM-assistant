[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chantier-defects"
version = "0.1.0"
description = "Détection de défauts sur béton (fissures, éclatements, armatures apparentes) + rapport d'inspection assisté par LLM/RAG"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pillow>=10.0",
    "scikit-learn>=1.4",
    "scikit-image>=0.26",
    "joblib>=1.3",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# PyTorch : installer la roue adaptée (CPU ou CUDA) depuis https://pytorch.org avant `pip install -e .[dl]`
dl = ["torch>=2.2", "torchvision>=0.17", "mlflow>=2.12", "matplotlib>=3.8"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
llm = ["anthropic>=2.3", "qdrant-client>=1.15", "fastembed>=0.7", "pypdf>=4.0"]
ui = ["streamlit>=1.33", "httpx>=0.27"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests qui téléchargent un modèle ou entraînent (désactivés par défaut en CI rapide)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # la longueur des lignes de code est gérée par `ruff format` ; chaînes et commentaires libres

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File"]
