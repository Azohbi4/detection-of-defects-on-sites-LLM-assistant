# Construction de l'image de l'interface (Dockerfile.ui) avec Cloud Build :
#   gcloud builds submit --config cloudbuild.ui.yaml .
# `gcloud builds submit --tag` n'accepte que le Dockerfile racine, d'où ce fichier.
substitutions:
  _REGION: europe-west9
  _REPO: chantier-images
  _TAG: v1

steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "Dockerfile.ui", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/ui:${_TAG}", "."]

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/ui:${_TAG}"
