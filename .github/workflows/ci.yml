name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write   # connexion OIDC à Google Cloud (Workload Identity Federation), sans clé longue durée

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Dépendances
        run: |
          pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dl,api,llm,dev]"
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest -q -m "not slow"   # les tests « slow » téléchargent le modèle d'embedding

  build-and-deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    env:
      # Les secrets ne sont pas utilisables directement dans un `if:` : on passe par une variable d'environnement.
      MODEL_URL: ${{ secrets.MODEL_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Authentification Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Configuration gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Configuration Docker pour Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev
      - name: Récupération du modèle
        if: env.MODEL_URL != ''
        run: curl --fail --silent --show-error -o models/model.pt "$MODEL_URL"
      - name: Build et push vers Google Artifact Registry
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_REPO }}/api:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Déploiement sur Google Cloud Run
        if: vars.GCP_SERVICE != ''
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.GCP_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
