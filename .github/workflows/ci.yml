name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write   # connexion OIDC à Azure, sans secret longue durée

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Dépendances
        run: |
          pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dl,api,llm,dev]"
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest -q -m "not slow"   # les tests « slow » téléchargent le modèle d'embedding

  build-and-deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && vars.ACR_NAME != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Récupération du modèle
        env:
          MODEL_URL: ${{ secrets.MODEL_URL }}
        run: curl --fail --silent --show-error -o models/model.pt "$MODEL_URL"
      - name: Build et push vers ACR
        run: |
          az acr login --name ${{ vars.ACR_NAME }}
          IMAGE=${{ vars.ACR_NAME }}.azurecr.io/chantier-api:${{ github.sha }}
          docker build -f docker/Dockerfile -t $IMAGE .
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Déploiement Container Apps
        if: vars.CONTAINER_APP != ''
        run: |
          az containerapp update -g ${{ vars.RESOURCE_GROUP }} -n ${{ vars.CONTAINER_APP }} --image $IMAGE
